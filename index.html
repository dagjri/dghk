<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動画リスト</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111111'/%3E%3Cpath d='M26 20l16 12-16 12z' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#111111;
  --gray:#666666;
  --line:#dddddd;
  --soft:#f5f5f5;
  --bg:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
  color:var(--ink);background:var(--bg);line-height:1.6;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
a{color:var(--ink)}

header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:2px solid var(--ink);padding:12px 16px 10px;
}
.brand{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;margin-bottom:8px}
.brand svg{width:24px;height:24px}
.controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.controls .btn{padding:6px 10px;font-size:12px}
.input{padding:6px 10px;border:1.5px solid var(--ink);border-radius:8px;background:var(--bg);font-size:13px}
#search{flex:1 1 200px;min-width:140px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tab{
  padding:5px 12px;font-size:12px;border:1.5px solid var(--ink);
  border-radius:999px;background:var(--bg);font-weight:600;
}
.tab.active{background:var(--ink);color:#fff}

#filters{
  display:none;border-top:1.5px solid var(--line);margin-top:8px;padding-top:8px;
}
#filters.open{display:block}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.filter-row label{font-size:12px;font-weight:700;min-width:60px}
.chipbox{
  display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:140px;
  padding:4px;border:1.5px solid var(--ink);border-radius:8px;min-height:32px;
  background:var(--bg);
}
.chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:1px 8px;font-size:12px;background:var(--ink);color:#fff;border-radius:999px;
  user-select:none;
}
.chip.outline{background:var(--bg);color:var(--ink)}
.chip .x{cursor:pointer;font-weight:700;padding:0 2px}
.chip-input{
  flex:1;min-width:80px;border:0;outline:none;padding:2px 4px;font-size:13px;background:transparent;
}

.btn{
  padding:6px 12px;border:1.5px solid var(--ink);border-radius:8px;
  background:var(--bg);color:var(--ink);font-size:13px;font-weight:600;
  transition:background .15s,color .15s;
}
.btn:hover{background:var(--ink);color:#fff}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#333;border-color:#333}
.btn-sm{padding:3px 8px;font-size:11px}

#viewBanner{
  display:none;margin-bottom:8px;padding:6px 12px;border:1.5px dashed var(--ink);
  border-radius:8px;background:var(--soft);font-size:12px;
}
body.readonly #viewBanner{display:block}
body.readonly .editonly{display:none !important}

main{max-width:920px;margin:0 auto;padding:14px 16px}
#meta{font-size:12px;color:var(--gray);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
#empty{
  text-align:center;padding:50px 16px;color:var(--gray);
  border:1.5px dashed var(--line);border-radius:12px;
}
#empty .big{font-size:40px;margin-bottom:6px}

.group-section{
  border:1.5px solid var(--ink);border-radius:12px;margin-bottom:12px;overflow:hidden;
}
.group-head{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;background:var(--ink);color:#fff;font-weight:700;
}
.group-head .name{font-size:14px;flex:1;word-break:break-word}
.group-head .count{font-size:11px;background:#fff;color:var(--ink);padding:1px 8px;border-radius:999px}
.group-body{padding:8px}

.card{
  border:1.5px solid var(--ink);border-radius:10px;
  padding:10px 12px;margin-bottom:8px;background:var(--bg);
  display:flex;gap:12px;align-items:stretch;
}
.thumb{flex:0 0 96px;align-self:center}
.thumb img{
  width:96px;height:54px;object-fit:cover;border:1px solid var(--line);
  border-radius:6px;filter:grayscale(1);transition:filter .2s;display:block;
}
.thumb img:hover{filter:grayscale(0)}
.thumb .noimg{
  width:96px;height:54px;border:1px solid var(--line);border-radius:6px;
  display:flex;align-items:center;justify-content:center;background:var(--soft);
}
.thumb .noimg svg{width:20px;height:20px;opacity:.5}
.card-body{flex:1;min-width:0}
.card-title{font-size:15px;font-weight:700;word-break:break-word;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card-title a{text-decoration:none}
.card-title a:hover{text-decoration:underline}
.star{cursor:pointer;color:var(--gray);font-size:16px;line-height:1}
.star.on{color:var(--ink)}
.card-url{
  font-size:11px;color:var(--gray);word-break:break-all;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.card-meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:4px}
.pill{
  display:inline-block;padding:1px 8px;font-size:11px;font-weight:600;
  border:1.5px solid var(--ink);border-radius:999px;background:var(--bg);cursor:pointer;
  white-space:nowrap;
}
.pill.dark{background:var(--ink);color:#fff}
.pill.ghost{background:transparent;border-style:dashed;color:var(--gray)}
.status-pill{
  display:inline-block;padding:1px 8px;font-size:11px;font-weight:600;
  border:1.5px solid var(--ink);border-radius:999px;
}
.status-unwatched{background:var(--bg);color:var(--ink)}
.status-watching{background:var(--soft);color:var(--ink)}
.status-watched{background:var(--ink);color:#fff}
.tag{font-size:11px;color:var(--gray)}
.memo{font-size:12px;color:var(--gray);margin-top:4px;white-space:pre-wrap;word-break:break-word}
.card-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px;color:var(--gray);margin-top:4px}
.card-act{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;justify-content:center}
.card-act .btn{padding:3px 8px;font-size:11px}

dialog{
  border:2px solid var(--ink);border-radius:12px;padding:0;
  max-width:560px;width:calc(100% - 32px);color:var(--ink);
}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg-inner{padding:18px}
.dlg-title{font-size:17px;font-weight:700;margin-bottom:12px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:3px}
.field input,.field textarea,.field select{
  width:100%;padding:6px 10px;border:1.5px solid var(--ink);border-radius:8px;background:var(--bg);font-size:14px;
}
.field textarea{height:60px;resize:vertical}
.field small{color:var(--gray);font-size:11px}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.row2 .field{flex:1;min-width:180px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.rating-stars{font-size:20px;cursor:pointer;user-select:none}
.rating-stars .s{color:var(--line)}
.rating-stars .s.on{color:var(--ink)}

.share-link{
  width:100%;height:80px;font-size:11px;padding:8px;border:1.5px solid var(--ink);
  border-radius:8px;resize:none;word-break:break-all;background:var(--soft);
}
.warn{
  margin-top:8px;padding:6px 10px;font-size:11px;background:var(--soft);
  border:1.5px dashed var(--ink);border-radius:8px;color:var(--gray);
}

.profile-list{max-height:240px;overflow:auto;border:1.5px solid var(--line);border-radius:8px;padding:6px}
.profile-row{
  display:flex;align-items:center;gap:6px;padding:4px;border-bottom:1px solid var(--line);
}
.profile-row:last-child{border-bottom:0}
.profile-row input{padding:3px 6px;font-size:13px;border:1px solid var(--ink);border-radius:6px}
.profile-row .pf-name{flex:0 0 130px}
.profile-row .pf-groups{flex:1}

.map-row{
  display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dotted var(--line);
}
.map-row:last-child{border-bottom:0}
.map-row .name{min-width:90px;font-weight:600;font-size:13px}
.map-row .groups{flex:1;font-size:12px;color:var(--gray)}

@media (max-width:560px){
  .card{flex-direction:column}
  .thumb{align-self:flex-start}
  .thumb img,.thumb .noimg{width:100%;height:auto;aspect-ratio:16/9;max-width:240px}
  .card-act{flex-direction:row}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="12" fill="#111"/><path d="M26 20l16 12-16 12z" fill="#fff"/></svg>
    動画リスト
  </div>
  <div id="viewBanner">👁 閲覧モード（編集不可）。自分のリストを開くには共有元の URL か保存した場所から。</div>
  <div class="controls">
    <input id="search" class="input" type="search" placeholder="🔍 検索（タイトル・出演者・グループ・タグ・メモ）">
    <select id="sortBy" class="input">
      <option value="dateDesc">新しい順</option>
      <option value="dateAsc">古い順</option>
      <option value="titleAsc">タイトル A→Z</option>
      <option value="titleDesc">タイトル Z→A</option>
      <option value="ratingDesc">評価が高い順</option>
    </select>
    <button class="btn editonly" id="btnFilters">⚙ フィルタ</button>
    <button class="btn btn-dark editonly" id="btnAdd">＋ 追加</button>
    <button class="btn editonly" id="btnProfile">👤 出演者プロフィール</button>
    <button class="btn editonly" id="btnShare">🔗 共有</button>
    <button class="btn editonly" id="btnExport">書き出し</button>
    <button class="btn editonly" id="btnImport">読み込み</button>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-view="flat">リスト</button>
    <button class="tab" data-view="byPerformer">出演者でまとめる</button>
    <button class="tab" data-view="byGroup">グループでまとめる</button>
    <button class="tab" data-view="byType">種類でまとめる</button>
    <button class="tab" data-view="byPlaylist">再生リストでまとめる</button>
  </div>
  <div id="filters">
    <div class="filter-row">
      <label>種類</label>
      <div class="chipbox" id="fCats"></div>
    </div>
    <div class="filter-row">
      <label>出演者</label>
      <div class="chipbox" id="fPerformers"></div>
    </div>
    <div class="filter-row">
      <label>グループ</label>
      <div class="chipbox" id="fGroups"></div>
    </div>
    <div class="filter-row">
      <label>状態</label>
      <select id="fStatus" class="input">
        <option value="">すべて</option>
        <option value="unwatched">未視聴</option>
        <option value="watching">視聴中</option>
        <option value="watched">視聴済み</option>
      </select>
      <label style="min-width:auto">★</label>
      <select id="fRating" class="input">
        <option value="">指定なし</option>
        <option value="5">★5</option>
        <option value="4">★4 以上</option>
        <option value="3">★3 以上</option>
        <option value="2">★2 以上</option>
        <option value="1">★1 以上</option>
      </select>
      <label style="min-width:auto"><input type="checkbox" id="fFav"> お気に入りのみ</label>
      <button class="btn btn-sm" id="btnResetFilters">リセット</button>
    </div>
  </div>
</header>

<main>
  <div id="meta"></div>
  <div id="view"></div>
  <div id="empty" hidden>
    <div class="big">▶</div>
    <p>まだ動画がありません。「＋ 追加」から登録してください。</p>
  </div>
</main>

<!-- 追加・編集 -->
<dialog id="dlg">
  <form id="form" method="dialog">
    <div class="dlg-inner">
      <div class="dlg-title" id="dlgTitle">動画を追加</div>
      <div class="field">
        <label for="fTitle">タイトル *</label>
        <input id="fTitle" type="text" required placeholder="例：〇〇 第10回">
      </div>
      <div class="field">
        <label for="fUrl">URL *</label>
        <input id="fUrl" type="url" required placeholder="https://www.youtube.com/watch?v=...">
      </div>
      <div class="row2">
        <div class="field">
          <label for="fCat">種類（例：バラエティ / ドラマ / MV）</label>
          <input id="fCat" type="text" list="catList" placeholder="自由入力">
          <datalist id="catList"></datalist>
        </div>
        <div class="field">
          <label for="fQuality">画質</label>
          <input id="fQuality" type="text" list="qualityList" placeholder="例：1920×1080">
          <datalist id="qualityList"></datalist>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>評価</label>
          <div class="rating-stars" id="ratingStars">
            <span class="s" data-v="1">★</span><span class="s" data-v="2">★</span><span class="s" data-v="3">★</span><span class="s" data-v="4">★</span><span class="s" data-v="5">★</span>
          </div>
        </div>
        <div class="field">
          <label>状態</label>
          <select id="fWatchStatus" class="input">
            <option value="unwatched">未視聴</option>
            <option value="watching">視聴中</option>
            <option value="watched">視聴済み</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>出演者（Enter で追加）</label>
        <input id="fPerformersInput" type="text" placeholder="例：山田太郎, 鈴木花子">
        <div id="fPerformersChips" class="chipbox" style="margin-top:4px;min-height:30px"></div>
        <small>プロフィールに登録した人は自動的に所属グループが提案されます</small>
      </div>
      <div class="field">
        <label>出演グループ（Enter で追加）</label>
        <input id="fGroupsInput" type="text" placeholder="例：嵐, 乃木坂46">
        <div id="fGroupsChips" class="chipbox" style="margin-top:4px;min-height:30px"></div>
      </div>
      <div class="field">
        <label>再生リスト</label>
        <input id="fPlaylist" type="text" list="playlistList" placeholder="例：今日の気分">
        <datalist id="playlistList"></datalist>
      </div>
      <div class="field">
        <label>タグ（カンマ区切り）</label>
        <input id="fTags" type="text" placeholder="例：入門, 2026">
      </div>
      <div class="field">
        <label>メモ</label>
        <textarea id="fMemo" placeholder="感想や気になったポイント"></textarea>
      </div>
      <div class="dlg-actions">
        <button type="button" class="btn" id="btnCancel">キャンセル</button>
        <button type="submit" class="btn btn-dark">保存</button>
      </div>
    </div>
  </form>
</dialog>

<!-- プロフィール管理 -->
<dialog id="profileDlg">
  <div class="dlg-inner">
    <div class="dlg-title">出演者プロフィール</div>
    <p class="warn">出演者とグループの紐付けを管理します。出演者を追加すると、関連するグループが動画の追加時に自動提案されます。</p>
    <div class="field">
      <label>出演者を追加</label>
      <div style="display:flex;gap:6px">
        <input id="pfName" type="text" placeholder="出演者名" style="flex:1">
        <input id="pfGroups" type="text" placeholder="所属グループ（カンマ区切り）" style="flex:2">
        <button class="btn btn-dark" id="pfAdd" type="button">追加</button>
      </div>
    </div>
    <div class="profile-list" id="profileList"></div>
    <div class="field" style="margin-top:12px">
      <label>現在の出演者⇄グループ 一覧</label>
      <div id="mapList" class="profile-list"></div>
    </div>
    <div class="dlg-actions">
      <button type="button" class="btn" id="btnCloseProfile">閉じる</button>
    </div>
  </div>
</dialog>

<!-- 共有 -->
<dialog id="shareDlg">
  <div class="dlg-inner">
    <div class="dlg-title">閲覧用 共有リンク</div>
    <textarea id="shareText" class="share-link" readonly></textarea>
    <p class="warn">⚠ データ更新後はリンクを作り直してください。</p>
    <div class="dlg-actions">
      <button type="button" class="btn" id="btnCopyLink">コピー</button>
      <button type="button" class="btn btn-dark" id="btnCloseShare">閉じる</button>
    </div>
  </div>
</dialog>

<!-- インポート -->
<dialog id="importDlg">
  <div class="dlg-inner">
    <div class="dlg-title">データを読み込む</div>
    <div class="field">
      <label>ファイル形式</label>
      <select id="impFormat" class="input">
        <option value="auto">自動判定</option>
        <option value="json">JSON（書き出し形式）</option>
        <option value="csv">CSV（Notion 書き出し形式）</option>
      </select>
    </div>
    <div id="csvMapArea" hidden>
      <div class="warn">CSV の列名とアプリの項目を対応させてください。タイトル列とURL列は必須です。</div>
      <div class="field"><label>タイトル列</label><select id="mapTitle" class="input"></select></div>
      <div class="field"><label>URL列</label><select id="mapUrl" class="input"></select></div>
      <div class="field"><label>種類列（任意）</label><select id="mapCat" class="input"></select></div>
      <div class="field"><label>画質列（任意）</label><select id="mapQuality" class="input"></select></div>
      <div class="field"><label>出演者列（任意）</label><select id="mapPerformers" class="input"></select></div>
      <div class="field"><label>グループ列（任意）</label><select id="mapGroups" class="input"></select></div>
      <div class="field"><label>タグ列（任意）</label><select id="mapTags" class="input"></select></div>
      <div class="field"><label>メモ列（任意）</label><select id="mapMemo" class="input"></select></div>
      <div class="field"><label>日付列（任意）</label><select id="mapDate" class="input"></select></div>
    </div>
    <div class="dlg-actions">
      <button type="button" class="btn" id="btnCloseImport">キャンセル</button>
      <button type="button" class="btn btn-dark" id="btnDoImport">読み込む</button>
    </div>
  </div>
</dialog>

<input type="file" id="fileImport" accept=".json,application/json,.csv,text/csv" hidden>

<script>
"use strict";
(function () {
  var LS_KEY = "videoList.v2";
  var LS_KEY_V1 = "videoList.v1";
  var state = {
    items: [],
    profile: { performers: {} },
    playlists: [],
    view: "flat",
    filters: { cats:[], performers:[], groups:[], status:"", rating:"", favOnly:false },
    sort: "dateDesc",
    ratingDraft: 0,
    performersDraft: [],
    groupsDraft: []
  };
  var viewMode = false;
  var editingId = null;
  var csvBuffer = null;

  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function load() {
    try {
      var raw = JSON.parse(localStorage.getItem(LS_KEY));
      var data = raw || {};
      state.items = Array.isArray(data.items) ? data.items : [];
      state.profile = (data.profile && data.profile.performers) || {};
      state.playlists = Array.isArray(data.playlists) ? data.playlists : [];
    } catch (e) {
      state.items = []; state.profile = {}; state.playlists = [];
    }
    if (!state.items.length) {
      try {
        var v1 = JSON.parse(localStorage.getItem(LS_KEY_V1));
        if (Array.isArray(v1) && v1.length) {
          state.items = v1.map(function(it){
            return norm({
              id: it.id, title: it.title, url: it.url,
              cat: it.cat, tags: it.tags, memo: it.memo, date: it.date
            });
          });
          save();
        }
      } catch(e){}
    }
  }
  function save() {
    localStorage.setItem(LS_KEY, JSON.stringify({
      items: state.items, profile: state.profile, playlists: state.playlists
    }));
  }
  function norm(o){
    return {
      id: o.id || (Date.now() + "-" + Math.random().toString(36).slice(2,8)),
      title: o.title || "(無題)",
      url: o.url || "",
      cat: o.cat || "",
      quality: o.quality || "",
      performers: Array.isArray(o.performers) ? o.performers : [],
      groups: Array.isArray(o.groups) ? o.groups : [],
      tags: Array.isArray(o.tags) ? o.tags : [],
      memo: o.memo || "",
      rating: Number(o.rating) || 0,
      favorite: !!o.favorite,
      watchStatus: ["unwatched","watching","watched"].indexOf(o.watchStatus) >= 0 ? o.watchStatus : "unwatched",
      playlist: o.playlist || "",
      date: o.date || new Date().toISOString().slice(0,10)
    };
  }

  function youtubeId(url){

  function applyFilters(items){
    var f = state.filters;
    var q = el("search").value.trim().toLowerCase();
    return items.filter(function(it){
      if (f.cats.length && f.cats.indexOf(it.cat)<0) return false;
      if (f.performers.length && !f.performers.every(function(p){ return it.performers.indexOf(p)>=0; })) return false;
      if (f.groups.length && !f.groups.every(function(g){ return it.groups.indexOf(g)>=0; })) return false;
      if (f.status && it.watchStatus !== f.status) return false;
      if (f.rating && it.rating < Number(f.rating)) return false;
      if (f.favOnly && !it.favorite) return false;
      if (q){
        var hay = [it.title, it.url, it.cat, (it.performers||[]).join(" "),
                   (it.groups||[]).join(" "), (it.tags||[]).join(" "), it.memo, it.playlist].join(" ").toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
  }
  function sortItems(items){
    var s = state.sort;
    items.sort(function(a,b){
      switch(s){
        case "dateAsc": return (a.date||"").localeCompare(b.date||"");
        case "titleAsc": return a.title.localeCompare(b.title,"ja");
        case "titleDesc": return b.title.localeCompare(a.title,"ja");
        case "ratingDesc": return (b.rating||0)-(a.rating||0);
        default: return (b.date||"").localeCompare(a.date||"");
      }
    });
    return items;
  }

  function bucketed(items, keyFn){
    var b = {};
    items.forEach(function(it){
      var keys = keyFn(it);
      if (!keys || !keys.length){ (b["未分類"] = b["未分類"] || []).push(it); return; }
      keys.forEach(function(k){
        if (!k) return;
        (b[k] = b[k] || []).push(it);
      });
    });
    return b;
  }

      var b = bucketed(filtered, function(it){ return it.performers; });
      var keys = Object.keys(b).sort(function(a,bb){
        if (a==='未分類') return 1; if (bb==='未分類') return -1;
        return b[bb].length - b[a].length;
      });
      view.innerHTML = keys.map(function(k){ return groupSectionHTML(k, b[k].length, b[k]); }).join("");
    } else if (state.view === "byGroup"){
      var b2 = bucketed(filtered, function(it){ return it.groups; });
      var keys2 = Object.keys(b2).sort(function(a,bb){
        if (a==='未分類') return 1; if (bb==='未分類') return -1;

      });
      view.innerHTML = keys2.map(function(k){ return groupSectionHTML(k, b2[k].length, b2[k]); }).join("");
    } else if (state.view === "byType"){
      var b3 = bucketed(filtered, function(it){ return [it.cat]; });
      view.innerHTML = Object.keys(b3).sort(function(a,bb){
        if (a==='未分類') return 1; if (bb==='未分類') return -1;
        return b3[bb].length - b3[a].length || a.localeCompare(bb,"ja");
      }).map(function(k){ return groupSectionHTML(k, b3[k].length, b3[k]); }).join("");

      var b4 = bucketed(filtered, function(it){ return [it.playlist || "（再生リストなし）"]; });
      view.innerHTML = Object.keys(b4).sort().map(function(k){ return groupSectionHTML(k, b4[k].length, b4[k]); }).join("");

    var catsFull = listCats().slice(); DEFAULT_CATS.forEach(function(c){ if (catsFull.indexOf(c)<0) catsFull.unshift(c); });

    el("playlistList").innerHTML = allPlaylists().map(function(p){ return '<option value="'+esc(p)+'">'; }).join("");

    refreshChipFilters();

  function exportCSV(){
    var headers = ["title","url","cat","quality","performers","groups","tags","memo","rating","favorite","watchStatus","playlist","date"];
    var rows = [headers.join(",")];
    function q(s){
      s = String(s==null?"":s);
      if (/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
      return s;
    }
    state.items.forEach(function(it){
      rows.push([
        q(it.title), q(it.url), q(it.cat), q(it.quality||""),
        q((it.performers||[]).join("; ")),
        q((it.groups||[]).join("; ")),
        q((it.tags||[]).join(", ")),
        q(it.memo), it.rating||0, it.favorite?"1":"0", it.watchStatus, q(it.playlist), q(it.date)
      ].join(","));
    });
    var blob = new Blob(["\uFEFF"+rows.join("\n")], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "video-list-" + new Date().toISOString().slice(0,10) + ".csv";
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }
  function parseCSV(text){
    text = text.replace(/^\uFEFF/, "");
    var rows = []; var row = []; var cur = ""; var inQ = false;
    for (var i=0;i<text.length;i++){
      var c = text[i];
      if (inQ){
        if (c === '"' && text[i+1] === '"'){ cur += '"'; i++; }
        else if (c === '"'){ inQ = false; }
        else cur += c;
      } else {
        if (c === '"'){ inQ = true; }
        else if (c === ','){ row.push(cur); cur=""; }
        else if (c === '\n' || c === '\r'){
          if (c==='\r' && text[i+1]==='\n') i++;
          row.push(cur); cur="";
          if (row.length > 1 || row[0] !== "") rows.push(row);
          row = [];
        } else cur += c;
      }
    }
    if (cur!=="" || row.length){ row.push(cur); rows.push(row); }
    return rows;
  }
  function detectCols(headers){
    var lower = headers.map(function(h){return String(h||"").trim().toLowerCase();});
    function find(arr){
      for (var i=0;i<arr.length;i++){
        var idx = lower.indexOf(arr[i]); if (idx>=0) return headers[idx];
        for (var j=0;j<lower.length;j++){
          if (lower[j] && lower[j].indexOf(arr[i].toLowerCase())>=0) return headers[j];
        }
      }
      return "";
    }
    var h = {
      title: find(["title","name","タイトル","名前","動画名","見出し"]),
      url:   find(["url","link","href","リンク","アドレス"]),
      cat:   find(["cat","genre","category","type","種類","カテゴリ","ジャンル","種別"]),
      quality: find(["quality","resolution","画質","解像度"]),
      performers: find(["performers","出演者","キャスト","出演"]),
      groups: find(["groups","group","出演グループ","グループ"]),
      tags:  find(["tags","tag","タグ"]),
      memo:  find(["memo","note","notes","メモ","備考","説明"]),
      date:  find(["date","日付","登録日","created","added"])
    };
    ["出演者（グループ/個人）","出演者（個人）","出演者（グループ名）","ジャンル","画質","メモ","名前"].forEach(function(label){
      var idx = headers.indexOf(label);
      if (idx<0) return;
      if (label==="名前") h.title = label;
      if (label==="出演者（グループ/個人）" || label==="出演者（個人）") h.performers = label;
      if (label==="出演者（グループ名）") h.groups = label;
      if (label==="ジャンル") h.cat = label;
      if (label==="画質") h.quality = label;
      if (label==="メモ") h.memo = label;
    });
    return h;
  }
  function openImportDialog(file){
    var reader = new FileReader();
    reader.onload = function(){
      var text = reader.result;
      var format = el("impFormat").value;
      if (format === "auto"){
        if (file.name.toLowerCase().endsWith(".csv")) format = "csv";
        else format = "json";
      }
      if (format === "json"){
        try{
          var data = JSON.parse(text);
          var items = Array.isArray(data) ? data : (Array.isArray(data.items) ? data.items : null);
          if (!items){ alert("JSON内に動画データが見つかりません。"); return; }
          if (!confirm(items.length + " 件のデータを読み込みます。よろしいですか？")) return;
          state.items = items.map(norm);
          if (data.profile) state.profile = data.profile;
          if (data.playlists) state.playlists = data.playlists;
          save(); render();
          alert(items.length + " 件読み込みました。");
        }catch(e){ alert("JSONの読み込みに失敗しました。"); }
        return;
      }
      csvBuffer = parseCSV(text);
      if (!csvBuffer.length){ alert("CSVが空です。"); return; }
      var headers = csvBuffer[0];
      var detected = detectCols(headers);
      var opts = ['<option value="">(なし)</option>'].concat(headers.map(function(h){ return '<option value="'+esc(h)+'">'+esc(h)+'</option>'; }).join(""));
      ["mapTitle","mapUrl","mapCat","mapQuality","mapPerformers","mapGroups","mapTags","mapMemo","mapDate"].forEach(function(id){
        var key = id.replace("map","").toLowerCase();
        var sel = el(id);
        sel.innerHTML = opts;
        sel.value = detected[key] || "";
      });
      el("csvMapArea").hidden = false;
      el("importDlg").showModal();
    };
    reader.readAsText(file);
  }
  function doCSVImport(){
    if (!csvBuffer) return;
    var map = {
      title: el("mapTitle").value, url: el("mapUrl").value,
      cat: el("mapCat").value, quality: el("mapQuality").value,
      performers: el("mapPerformers").value,
      groups: el("mapGroups").value, tags: el("mapTags").value,
      memo: el("mapMemo").value, date: el("mapDate").value
    };
    if (!map.title || !map.url){ alert("タイトル列とURL列は必須です。"); return; }
    var idx = {};
    csvBuffer[0].forEach(function(h,i){ idx[h] = i; });
    function col(row, name){ return name && idx[name]!=null ? (row[idx[name]]||"").trim() : ""; }
    var added = 0;
    for (var r=1; r<csvBuffer.length; r++){
      var row = csvBuffer[r];
      var title = col(row, map.title); var url = col(row, map.url);
      if (!title || !url) continue;
      var it = norm({
        title: title, url: url,
        cat: col(row, map.cat),
        quality: col(row, map.quality),
        performers: col(row, map.performers) ? col(row, map.performers).split(/[,;|、;]/).map(function(s){return s.trim();}).filter(Boolean) : [],
        groups: col(row, map.groups) ? col(row, map.groups).split(/[,;|、;]/).map(function(s){return s.trim();}).filter(Boolean) : [],
        tags: col(row, map.tags) ? col(row, map.tags).split(/[,;|、]/).map(function(s){return s.trim();}).filter(Boolean) : [],
        memo: col(row, map.memo),
        date: col(row, map.date) || new Date().toISOString().slice(0,10)
      });
      it.id = Date.now() + "-" + r + "-" + Math.random().toString(36).slice(2,6);
      state.items.unshift(it);
      added++;
    }
    save(); render();
    csvBuffer = null;
    el("importDlg").close();
    el("csvMapArea").hidden = true;
    alert(added + " 件読み込みました。");
  }

  function renderProfile(){
    var list = el("profileList");
    var names = Object.keys(state.profile);
    if (!names.length){ list.innerHTML = '<div class="warn">まだ登録がありません。</div>'; }
    else {
      list.innerHTML = names.sort(function(a,b){return a.localeCompare(b,"ja");}).map(function(n){
        var g = (state.profile[n].groups||[]).join(", ");
        return '<div class="profile-row">'+
          '<input class="pf-name" data-pf-name="'+esc(n)+'" value="'+esc(n)+'">'+
          '<input class="pf-groups" data-pf-groups="'+esc(n)+'" value="'+esc(g)+'" placeholder="所属グループ（カンマ区切り）">'+
          '<button class="btn btn-sm" data-pf-del="'+esc(n)+'">削除</button>'+
        '</div>';
      }).join("");
    }
    renderMapList();
  }
  function renderMapList(){
    var names = Object.keys(state.profile);
    var map = el("mapList");
    if (!names.length){ map.innerHTML = '<div class="warn">出演者を追加すると、ここに紐付け一覧が出ます。</div>'; return; }
    map.innerHTML = names.sort(function(a,b){return a.localeCompare(b,"ja");}).map(function(n){
      var gr = (state.profile[n].groups||[]);
      return '<div class="map-row"><span class="name">'+esc(n)+'</span><span class="groups">所属: '+(gr.length?esc(gr.join(" / ")):"未設定")+'</span></div>';
    }).join("");
  }

  el("search").addEventListener("input", render);
  el("sortBy").addEventListener("change", function(){ state.sort = this.value; render(); });

  el("tabs").addEventListener("click", function(e){
    var t = e.target.closest(".tab"); if (!t) return;
    el("tabs").querySelectorAll(".tab").forEach(function(x){ x.classList.remove("active"); });
    t.classList.add("active");
    state.view = t.getAttribute("data-view");
    render();
  });

  el("btnFilters").addEventListener("click", function(){
    el("filters").classList.toggle("open");
  });

  function wireFilterChip(boxId, filterKey){
    var box = el(boxId);
    box.addEventListener("click", function(e){
      var x = e.target.closest(".x"); if (!x) return;
      var v = x.parentElement.getAttribute("data-v");
      state.filters[filterKey] = state.filters[filterKey].filter(function(t){ return t!==v; });
      render();
    });
    box.addEventListener("change", function(e){
      var inp = e.target; if (inp.tagName !== "INPUT") return;
      var v = inp.value.trim(); if (!v) return;
      if (state.filters[filterKey].indexOf(v)<0) state.filters[filterKey].push(v);
      inp.value = "";
      render();
    });
    box.addEventListener("keydown", function(e){
      if (e.key === "Enter"){
        var inp = e.target; var v = inp.value.trim();
        if (v && state.filters[filterKey].indexOf(v)<0) state.filters[filterKey].push(v);
        inp.value = ""; render();
      }
    });
  }
  wireFilterChip("fCats", "cats");
  wireFilterChip("fPerformers", "performers");
  wireFilterChip("fGroups", "groups");

  el("fStatus").addEventListener("change", function(){ state.filters.status = this.value; render(); });
  el("fRating").addEventListener("change", function(){ state.filters.rating = this.value; render(); });
  el("fFav").addEventListener("change", function(){ state.filters.favOnly = this.checked; render(); });
  el("btnResetFilters").addEventListener("click", function(){
    state.filters = { cats:[], performers:[], groups:[], status:"", rating:"", favOnly:false };
    el("fStatus").value = ""; el("fRating").value = ""; el("fFav").checked = false;
    render();
  });

  el("btnAdd").addEventListener("click", function(){ openDialog(null); });
  el("btnCancel").addEventListener("click", function(){ el("dlg").close(); });
  el("form").addEventListener("submit", function(e){ e.preventDefault(); submitForm(); });

  el("ratingStars").addEventListener("click", function(e){
    var s = e.target.closest(".s"); if (!s) return;
    var v = Number(s.getAttribute("data-v"));
    state.ratingDraft = (state.ratingDraft === v) ? 0 : v;
    updateStarDraft();
  });

  function wireFormChip(boxId, inputId, draftArr){
    el(inputId).addEventListener("keydown", function(e){
      if (e.key === "Enter" || e.key === ","){
        e.preventDefault();
        addChipFromInput(this, draftArr);
        updateChips();
        suggestGroups(draftArr);
      }
    });
    el(boxId).addEventListener("click", function(e){
      var x = e.target.closest(".x"); if (!x) return;
      var v = x.getAttribute("data-rm");
      var i = draftArr.indexOf(v); if (i>=0) draftArr.splice(i,1);
      updateChips();
    });
  }
  function suggestGroups(perfs){
    var sug = [];
    perfs.forEach(function(p){
      if (state.profile[p] && state.profile[p].groups){
        state.profile[p].groups.forEach(function(g){ if (state.groupsDraft.indexOf(g)<0 && sug.indexOf(g)<0) sug.push(g); });
      }
    });
    if (sug.length && confirm("プロフィールから次のグループを追加しますか？\n・ " + sug.join("\n・ "))){
      sug.forEach(function(g){ state.groupsDraft.push(g); });
      updateChips();
    }
  }
  wireFormChip("fPerformersChips", "fPerformersInput", state.performersDraft);
  wireFormChip("fGroupsChips", "fGroupsInput", state.groupsDraft);

  el("view").addEventListener("click", function(e){
    var t = e.target;
    if (t.classList && t.classList.contains("star") && t.hasAttribute("data-fav")){
      var id = t.getAttribute("data-fav");
      for (var i=0;i<state.items.length;i++){
        if (state.items[i].id === id){ state.items[i].favorite = !state.items[i].favorite; break; }
      }
      save(); render(); return;
    }
    var stBtn = t.closest ? t.closest("[data-status]") : null;
    if (stBtn){
      var id2 = stBtn.getAttribute("data-status");
      var order = ["unwatched","watching","watched"];
      for (var j=0;j<state.items.length;j++){
        if (state.items[j].id === id2){
          var cur = order.indexOf(state.items[j].watchStatus);
          state.items[j].watchStatus = order[(cur+1)%order.length];
          break;
        }
      }
      save(); render(); return;
    }
    var fc = t.closest ? t.closest("[data-filter-cat]") : null;
    if (fc){ state.filters.cats = [fc.getAttribute("data-filter-cat")]; el("filters").classList.add("open"); render(); return; }
    var fp = t.closest ? t.closest("[data-filter-perf]") : null;
    if (fp){ state.filters.performers = [fp.getAttribute("data-filter-perf")]; el("filters").classList.add("open"); render(); return; }
    var fg = t.closest ? t.closest("[data-filter-grp]") : null;
    if (fg){ state.filters.groups = [fg.getAttribute("data-filter-grp")]; el("filters").classList.add("open"); render(); return; }
    var fpl = t.closest ? t.closest("[data-filter-pl]") : null;
    if (fpl){ state.view = "byPlaylist"; el("tabs").querySelectorAll(".tab").forEach(function(x){ x.classList.toggle("active", x.getAttribute("data-view")==="byPlaylist"); }); render(); return; }
    var eb = t.closest ? t.closest("[data-edit]") : null;
    if (eb){ var ie = eb.getAttribute("data-edit"); for (var ii=0;ii<state.items.length;ii++) if (state.items[ii].id===ie){ openDialog(state.items[ii]); break; } return; }
    var db = t.closest ? t.closest("[data-del]") : null;
    if (db){
      var id3 = db.getAttribute("data-del"); var tgt=null;
      for (var k=0;k<state.items.length;k++) if (state.items[k].id===id3){ tgt=state.items[k]; break; }
      if (tgt && confirm("「"+tgt.title+"」を削除します。よろしいですか？")){
        state.items.splice(k,1); save(); render();
      }
    }
  });

  el("btnProfile").addEventListener("click", function(){ renderProfile(); el("profileDlg").showModal(); });
  el("btnCloseProfile").addEventListener("click", function(){ el("profileDlg").close(); });
  el("pfAdd").addEventListener("click", function(){
    var n = el("pfName").value.trim(); var g = el("pfGroups").value.trim();
    if (!n) return;
    var gs = g ? g.split(",").map(function(s){return s.trim();}).filter(Boolean) : [];
    state.profile[n] = { groups: gs };
    el("pfName").value = ""; el("pfGroups").value = "";
    save(); renderProfile();
  });
  el("profileList").addEventListener("click", function(e){
    var d = e.target.closest("[data-pf-del]"); if (!d) return;
    delete state.profile[d.getAttribute("data-pf-del")];
    save(); renderProfile();
  });
  el("profileList").addEventListener("change", function(e){
    var inp = e.target;
    if (inp.hasAttribute("data-pf-name")){
      var old = inp.getAttribute("data-pf-name"); var nn = inp.value.trim();
      if (nn && nn !== old){
        state.profile[nn] = state.profile[old]; delete state.profile[old];
        inp.setAttribute("data-pf-name", nn); save(); renderMapList();
      }
    } else if (inp.hasAttribute("data-pf-groups")){
      var n2 = inp.getAttribute("data-pf-groups");
      state.profile[n2].groups = inp.value.split(",").map(function(s){return s.trim();}).filter(Boolean);
      save(); renderMapList();
    }
  });

  el("btnShare").addEventListener("click", function(){
    if (!state.items.length){ alert("まだデータがありません。"); return; }
    el("shareText").value = buildShareLink();
    el("shareDlg").showModal();
  });
  el("btnCopyLink").addEventListener("click", function(){
    var ta = el("shareText"); ta.select();
    var done = function(){
      el("btnCopyLink").textContent = "コピーしました！";
      setTimeout(function(){ el("btnCopyLink").textContent = "コピー"; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(done, function(){ document.execCommand("copy"); done(); });
    } else { document.execCommand("copy"); done(); }
  });
  el("btnCloseShare").addEventListener("click", function(){ el("shareDlg").close(); });

  el("btnExport").addEventListener("click", function(){
    var ans = prompt("書き出し形式を入力： json / csv", "json");
    if (ans === "json") exportJSON();
    else if (ans === "csv") exportCSV();
  });

  el("btnImport").addEventListener("click", function(){ el("fileImport").click(); });
  el("fileImport").addEventListener("change", function(){
    var f = this.files && this.files[0]; if (!f) return;
    openImportDialog(f);
    this.value = "";
  });
  el("impFormat").addEventListener("change", function(){ el("csvMapArea").hidden = this.value !== "csv"; });
  el("btnCloseImport").addEventListener("click", function(){ el("importDlg").close(); csvBuffer=null; });
  el("btnDoImport").addEventListener("click", doCSVImport);

  checkViewMode();
  load();
  Object.keys(DEFAULT_PERFORMER_GROUPS).forEach(function(name){
    if (!state.profile[name]) state.profile[name] = { groups: DEFAULT_PERFORMER_GROUPS[name].slice() };
  });
  save();
  render();

  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
})();
</script>
</body>
</html>
